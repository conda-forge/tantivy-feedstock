schema_version: 1

context:
  name: tantivy
  version: "0.26.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tantivy-${{ version }}.tar.gz
  sha256: 93519eb9f18c298a6779d132505d67f158741318413c181e9ec488381edf2721

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
    - pkg-config
  host:
    - python
    - maturin >=1.9.3,<2.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - tantivy
      pip_check: true

about:
  summary: Python bindings for Tantivy
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/quickwit-oss/tantivy-py

extra:
  recipe-maintainers:
    - jan-janssen
