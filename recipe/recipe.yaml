schema_version: 1

context:
  name: tantivy
  version: "0.27.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tantivy-${{ version }}.tar.gz
  sha256: 871d0dc8d3b246d6b8cbf99a2f0ec929eb4e3341ecb3a63e3c7c11c6715cd03d

build:
  number: 0
  script:
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
    - pkg-config
  host:
    - python
    - maturin >=1.9.3,<2.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - tantivy
      pip_check: true

about:
  summary: Python bindings for Tantivy
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/quickwit-oss/tantivy-py

extra:
  recipe-maintainers:
    - jan-janssen
